<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <h1>Prueba Fullstack</h1>
      <p>Inicia sesión para continuar</p>
    </div>

    <form (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="admin o user"
          [class.invalid]="usernameInvalid"
          autocomplete="username"
        />
        @if (usernameInvalid) {
          <span class="field-error">El usuario es requerido</span>
        }
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="admin123 o user123"
          [class.invalid]="passwordInvalid"
          autocomplete="current-password"
        />
        @if (passwordInvalid) {
          <span class="field-error">La contraseña es requerida</span>
        }
      </div>

      @if (error()) {
        <div class="alert-error">{{ error() }}</div>
      }

      <button type="submit" class="btn-primary">Iniciar sesión</button>
    </form>

    <div class="login-footer">
      <p><strong>Admin:</strong> admin / admin123</p>
      <p><strong>Usuario:</strong> user / user123</p>
    </div>

    <button class="theme-toggle-login" (click)="theme.toggle()" type="button">
      {{ theme.isDark() ? '☀️' : '🌙' }}
    </button>
  </div>
</div>
